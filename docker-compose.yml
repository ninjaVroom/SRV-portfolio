# Docker self-host stack for the Samuel Roland Vroom portfolio.
#
#   Local development DB only (run the Next/Payload app on the host):
#       docker compose up -d postgres
#
#   Full self-hosted stack (Postgres + the built Next.js/Payload app):
#       docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload
      POSTGRES_DB: srv_portfolio
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d srv_portfolio']
      interval: 5s
      timeout: 5s
      retries: 10

  payload:
    profiles: ['app']
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://payload:payload@postgres:5432/srv_portfolio
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-to-a-long-random-string}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@samuelrolandvroom.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    ports:
      - '3000:3000'
    volumes:
      # Persist uploaded media (local-disk storage) outside the container.
      - media:/app/media

volumes:
  pgdata:
  media:
